<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0b10;font-family:Inter,"Noto Color Emoji",sans-serif;color:#fff}
body.post{height:1350px}
#S{position:absolute;inset:0;overflow:hidden}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(8,1fr);gap:12px;padding:12px;background:#0b0b10}
.p{position:relative;overflow:hidden;border-radius:4px;display:grid;place-items:center}
.p::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.18) 1.4px,transparent 1.6px) 0 0/9px 9px;mix-blend-mode:multiply;pointer-events:none}
.p .e{font-size:min(170px,9vh);filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.p .c{position:absolute;left:14px;bottom:14px;background:#0b0b10;color:#fff;font-weight:900;font-size:min(34px,2vh);padding:8px 14px;transform:rotate(-2deg);text-transform:uppercase;letter-spacing:.02em;z-index:2;white-space:nowrap}
.p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.sun{background:linear-gradient(180deg,#ffb35a 0,#ff5f7e 45%,#7a2e8e 100%)}
.sun .ball{position:absolute;left:50%;top:38%;width:46%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(#ffe68a,#ff8a4d);box-shadow:0 0 60px #ffcf6a}
.sun .palm{position:absolute;font-size:min(210px,11vh);bottom:2%}
.teal{background:linear-gradient(160deg,#25d1c4,#11607d)}
.pink{background:linear-gradient(160deg,#ff6fb5,#a3238f)}
.night{background:linear-gradient(180deg,#1b1f4b,#4b2a7a)}
.orng{background:linear-gradient(160deg,#ffb347,#e2553b)}
.lime{background:linear-gradient(160deg,#c4f25a,#3b9c5a)}
.blue{background:linear-gradient(160deg,#5aa9ff,#2c3fa3)}
.siren{background:linear-gradient(90deg,#e8364f 0 50%,#3557e8 50% 100%)}
.title{background:#0b0b10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.title::after{display:none}
.title .a{font-family:"Inter Display",Inter;font-weight:900;font-size:min(150px,8vh);line-height:.9;letter-spacing:-.03em;transform:scaleX(.82);text-transform:uppercase}
.title .b{font-family:"Inter Display",Inter;font-weight:900;font-size:min(260px,14vh);line-height:.85;letter-spacing:-.04em;
 background:linear-gradient(90deg,#ff5fa2,#ffb35a 55%,#25d1c4);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(255,95,162,.25))}
.title .s{font-size:min(36px,2vh);font-weight:700;color:#cfcbe0;letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.stars{position:absolute;right:14px;top:12px;font-size:min(42px,2.4vh);color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;letter-spacing:2px;z-index:2}
.bubble{position:absolute;right:10%;top:12%;background:#fff;color:#0b0b10;font-weight:800;font-size:min(30px,1.7vh);padding:10px 14px;border-radius:18px;z-index:2}
.pct{position:absolute;top:10%;right:6%;font-weight:900;font-size:min(80px,4.5vh);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.3);z-index:2}
.strip{background:#ff5fa2;display:grid;place-items:center;text-align:center;font-weight:900;font-size:min(50px,2.8vh);line-height:1.15;color:#0b0b10;padding:0 30px}
.strip::after{display:none}
/* reel overlays */
.ov{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 70px;gap:40px}
.ov h1{font-size:96px;font-weight:900;line-height:1.05;letter-spacing:-.02em}
.ov h2{font-size:64px;font-weight:800;line-height:1.15;color:#ffd0e6}
.dim{position:absolute;inset:0;background:#0b0b10;z-index:9}
.endc{position:absolute;left:60px;right:60px;bottom:200px;z-index:10;background:rgba(11,11,16,.9);border:6px solid #ff5fa2;border-radius:40px;padding:44px 40px;text-align:center}
.endc h3{font-size:70px;font-weight:900;line-height:1.1}
.endc p{font-size:44px;font-weight:700;color:#cfcbe0;margin-top:22px;line-height:1.3}
</style></head><body><div id="S"></div>
<script>
const S=document.getElementById('S');
const clamp=x=>Math.max(0,Math.min(1,x)),ease=p=>1-Math.pow(1-p,3),pop=(t,a,d=.35)=>clamp((t-a)/d);
const back=p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const IMG='../ksenia.jpg';
// panels: [grid-area, class, inner html, caption]
const P=[
 ['1/1/3/3','sun','<div class="ball"></div><div class="palm">🌴</div>','Все уже играют'],
 ['1/3/2/5','teal','<div class="e">🎮</div>','Джойстик пылится'],
 ['2/3/4/5','pink',`<img src="${IMG}">`,'Ксения. Прикроет'],
 ['3/1/4/3','night','<div class="e">☕</div><div class="stars" style="left:14px;right:auto">03:47</div>','Глава 2. Ночь'],
 ['6/1/8/2','orng','<div class="e">👨‍🏫</div><div class="bubble">Зайдите<br>ко мне</div>','Научрук'],
 ['6/2/7/4','siren','<div class="e">🚨</div><div class="stars">★★★★★</div>','Дедлайн на хвосте'],
 ['7/2/8/4','lime','<div class="e">📄</div><div class="pct">41%</div>','Антиплагиат'],
 ['6/4/8/5','blue','<div class="e">📚</div>','37 книг'],
];
function cover(t,opts){
 // t = time since cover start; opts.all = show everything instantly
 let h='<div class="grid">';
 P.forEach((p,i)=>{const a=opts.all?1:pop(t,i*.55,.35);if(a<=0){h+=`<div class="p" style="grid-area:${p[0]};background:#14141c"></div>`;return}
  const s=opts.all?1:.6+.4*back(a);
  h+=`<div class="p ${p[1]}" style="grid-area:${p[0]}"><div style="position:absolute;inset:0;display:grid;place-items:center;transform:scale(${s});opacity:${ease(a)}">${p[2]}</div><div class="c" style="opacity:${ease(opts.all?1:pop(t,i*.55+.2,.25))}">${p[3]}</div></div>`;});
 const ta=opts.all?1:pop(t,P.length*.55,.4);
 h+=`<div class="p title" style="grid-area:4/1/6/5"><div class="a" style="opacity:${ease(ta)}">Диплом</div><div class="b" style="opacity:${ease(ta)};transform:scale(${opts.all?1:.5+.5*back(ta)})">VI</div><div class="s" style="opacity:${ease(opts.all?1:pop(t,P.length*.55+.5,.3))}">выходит, когда одобрит научрук</div></div>`;
 const sa=opts.all?1:pop(t,P.length*.55+1.1,.35);
 h+=`<div class="p strip" style="grid-area:8/1/9/5;opacity:${ease(sa)}">${opts.strip}</div>`;
 return h+'</div>';
}
const HOOK=3.4, CV=HOOK, END=CV+7.2, LEN=END+4.2;
function render(t){
 let h='';
 if(t<HOOK){
  const a=t<3?1:1-ease(pop(t,3,.4));
  h+=`<div class="dim"></div><div class="ov" style="opacity:${a}"><h1 style="opacity:${ease(pop(t,0,.3))};transform:scale(${.8+.2*back(pop(t,0,.4))})">19 ноября<br>выходит GTA 6 🎮</h1><h2 style="opacity:${ease(pop(t,1.3,.35))}">все уже скачивают…<br>а у тебя диплом 🙃</h2></div>`;
 } else {
  const lt=t-CV;
  h+=cover(lt,{strip:'Хочешь играть, а не думать о дипломе?'});
  if(t>=END){const e=t-END;
   h+=`<div class="endc" style="opacity:${ease(pop(e,0,.4))};transform:translateY(${(1-ease(pop(e,0,.4)))*80}px)"><h3>Ты играй 🎮<br>с дипломом помогу я</h3><p>Пиши мне в директ 👇<br>сдаю по главам, научрук видит прогресс</p></div>`;}
 }
 S.innerHTML=h;
}
function poster(){document.body.classList.add('post');S.innerHTML=cover(0,{all:true,strip:'Хочешь играть, а не думать о дипломе?<br>Пиши мне 😉'});}
window.CLIPS={D:{fn:render,len:LEN}};
if(location.hash==='#post')poster();else render(0);
</script></body></html>
