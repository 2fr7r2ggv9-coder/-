<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1d1236;font-family:Inter,"Noto Color Emoji",sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden}
#cam{position:absolute;left:0;top:0;width:966px;height:2048px;transform-origin:0 0;will-change:transform,filter}
#cam img{width:966px;height:2048px;display:block}
/* atmosphere */
.fx{position:absolute;inset:0;pointer-events:none}
#tint{background:linear-gradient(180deg,rgba(120,40,200,.28) 0%,rgba(255,80,160,.10) 45%,rgba(255,140,60,.18) 70%,rgba(40,10,70,.45) 100%);mix-blend-mode:soft-light}
#leak{mix-blend-mode:screen}
.blob{position:absolute;border-radius:50%;filter:blur(70px)}
#vig{background:radial-gradient(ellipse 75% 60% at 50% 50%,transparent 55%,rgba(10,4,25,.75) 100%)}
#grain{width:270px;height:480px;transform:scale(4);transform-origin:0 0;opacity:.13;mix-blend-mode:overlay;image-rendering:pixelated}
#scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 5px);opacity:.35}
#flash{background:#fff;opacity:0}
#birds svg{position:absolute}
.streak{position:absolute;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,#ffd1f0 40%,#fff 50%,#ff8ad0 60%,transparent);filter:blur(1.5px);mix-blend-mode:screen}
/* overlay text */
#ov{position:absolute;inset:0;z-index:5}
.disp{font-family:"Inter Display",Inter;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
.neon{background:linear-gradient(180deg,#fff6c9 0%,#ffb36b 35%,#ff5fa2 70%,#c447ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #2a0f45) drop-shadow(0 0 28px rgba(255,95,162,.65))}
.hookw{position:absolute;left:0;right:0;text-align:center}
.chroma{position:relative;display:inline-block}
.date{position:absolute;left:0;right:0;top:120px;text-align:center}
.date .d{font-size:250px;line-height:.85;display:inline-block;transform:scaleX(.8)}
.date .m{font-size:92px;line-height:1;display:block;margin-top:6px;transform:scaleX(.85)}
.date .g{display:inline-block;margin-top:26px;font-size:54px;font-weight:900;padding:12px 34px;border-radius:14px;background:#ff5fa2;color:#1a0d2e;box-shadow:0 10px 0 #2a0f45;letter-spacing:.04em}
.sub{position:absolute;left:60px;right:60px;bottom:280px;text-align:center;font-weight:900;font-size:62px;line-height:1.15;text-shadow:0 4px 0 #2a0f45,0 0 30px rgba(0,0,0,.5)}
.bub{position:absolute;left:70px;right:70px;top:270px;background:#fff;color:#1a1326;border-radius:44px;padding:36px 40px;font-weight:800;font-size:64px;line-height:1.15;box-shadow:0 14px 0 #2a0f45,0 30px 60px rgba(0,0,0,.35)}
.bub b{display:block;font-size:34px;color:#e2447f;margin-bottom:10px;letter-spacing:.08em;text-transform:uppercase;font-family:"Inter Display";font-weight:900}
.bub::after{content:"";position:absolute;bottom:-34px;width:0;height:0;border:36px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.l::after{left:30%}.bub.r::after{right:30%}
.bub .w{display:inline-block}
/* wanted */
.want{position:absolute;right:46px;top:96px;text-align:right}
.want .lbl{font-family:"Inter Display";font-weight:900;font-size:40px;letter-spacing:.12em;color:#fff;text-shadow:0 3px 0 #2a0f45;margin-bottom:8px}
.stars{display:flex;gap:6px;justify-content:flex-end}
.stars svg{width:84px;height:84px;filter:drop-shadow(0 4px 0 #2a0f45)}
/* mission */
.mis{position:absolute;left:0;right:0;top:640px;text-align:center}
.mis .a{font-size:150px;line-height:.88;display:block;transform:scaleX(.8)}
.mis .b{display:inline-block;margin-top:24px;font-size:48px;font-weight:900;color:#1a0d2e;background:#7cffc4;padding:10px 30px;border-radius:12px;box-shadow:0 8px 0 #2a0f45}
.top{position:absolute;left:50px;right:50px;top:150px;text-align:center;font-weight:900;font-size:76px;line-height:1.08;letter-spacing:-.02em;text-shadow:0 5px 0 #2a0f45,0 0 30px rgba(0,0,0,.4)}
.endc{position:absolute;left:60px;right:60px;bottom:200px;background:rgba(26,12,46,.9);border:6px solid #ff5fa2;border-radius:40px;padding:40px;text-align:center;box-shadow:0 0 50px rgba(255,95,162,.45)}
.endc h3{font-size:58px;font-weight:900;line-height:1.1}
.endc p{font-size:38px;font-weight:700;color:#e6dcf5;margin-top:12px;line-height:1.3}
.who{display:flex;align-items:center;gap:30px;text-align:left}
.who img{width:200px;height:200px;border-radius:50%;object-fit:cover;border:6px solid #ff5fa2;flex:none}
.cta{margin-top:30px;background:linear-gradient(90deg,#ffb36b,#ff5fa2);color:#1a1326;font-weight:900;font-size:48px;border-radius:24px;padding:20px}
.brand{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:34px;font-weight:700;color:rgba(255,255,255,.88);text-shadow:0 2px 8px rgba(0,0,0,.6)}
</style></head><body>
<div id="stage">
 <div id="cam"><img src="assets/gta6-art.jpg"></div>
 <div class="fx" id="tint"></div>
 <div class="fx" id="leak"></div>
 <div class="fx" id="birds"></div>
 <div class="fx" id="streaks"></div>
 <div class="fx" id="scan"></div>
 <canvas class="fx" id="grain" width="270" height="480"></canvas>
 <div class="fx" id="vig"></div>
 <div id="ov"></div>
 <div class="fx" id="flash" style="z-index:9"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cam=$('cam'),ov=$('ov'),leak=$('leak'),birds=$('birds'),streaks=$('streaks'),flash=$('flash'),gctx=$('grain').getContext('2d');
const clamp=x=>Math.max(0,Math.min(1,x)),ease=p=>1-Math.pow(1-p,3),io=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,pop=(t,a,d=.35)=>clamp((t-a)/d);
const back=p=>{const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const slam=p=>p<=0?0:(p>=1?1:1+Math.sin(p*Math.PI*2.2)*Math.pow(1-p,2)*.35);
function rnd(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296}}

const LEN=23;
/* camera keys: t, x, y, scale ; quick moves between shots = whip pans */
const K=[[0,483,1250,1.06],[3.2,483,1040,1.2],[3.55,450,880,2.3],[6.7,462,860,2.45],[7.05,592,900,2.3],[10.2,600,875,2.45],[10.55,440,870,2.5],[13.7,448,858,2.62],[14.05,596,885,2.65],[15.2,600,880,2.8],[15.35,600,880,3.15],[16.9,602,878,3.25],[17.35,483,1100,1.12],[23,483,1040,1.2]];
function camAt(t){if(t<=K[0][0])return K[0].slice(1);for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1];if(t<=b[0]){const d=b[0]-a[0],p=d<.5?io((t-a[0])/d):ease((t-a[0])/d)*.15+io((t-a[0])/d)*.85;return [a[1]+(b[1]-a[1])*p,a[2]+(b[2]-a[2])*p,a[3]+(b[3]-a[3])*p];}}return K[K.length-1].slice(1);}
const CUTS=[3.2,6.7,10.2,13.7,15.2,16.9];

const STAR='<svg viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.1.8-5.3 4.9 1.5 7.1L12 17.6l-6.4 3.6 1.5-7.1L1.8 9.2l7.1-.8z" fill="FILL" stroke="#2a0f45" stroke-width="1.4" stroke-linejoin="round"/></svg>';
function stars(t,n,blink){let h='';for(let i=0;i<5;i++){const on=i<n;const b=blink&&on&&Math.sin(t*14)>0;h+=STAR.replace('FILL',on?(b?'#ffffff':'#ffd23f'):'rgba(255,255,255,.18)');}return h;}

function words(t,t0,txt,step=.09){return txt.split(/(<br>)/).map(s=>s==='<br>'?s:s.split(' ').map((w,i,arr)=>{const p=pop(t,t0+i*step,.22);return `<span class="w" style="opacity:${ease(p)};transform:translateY(${(1-ease(p))*30}px)">${w}</span>`}).join(' ')).join('');}
let wc=0;
function bub(t,a0,a1,side,who,txt){wc=0;const out=ease(pop(t,a1-.25,.25));const p=pop(t,a0,.4);
 const tilt=(side==='l'?-1:1)*(1-ease(p))*8;
 return `<div class="bub ${side}" style="opacity:${ease(pop(t,a0,.15))*(1-out)};transform:translateY(${(1-ease(p))*-60}px) rotate(${tilt}deg) scale(${.7+.3*back(p)})"><b>${who}</b>${words(t,a0+.12,txt)}</div>`}

function chromaText(cls,html,amt){ // RGB split for impact
 return `<span class="chroma"><span class="${cls}" style="position:absolute;left:${-amt}px;top:0;color:#00e5ff;opacity:.7;mix-blend-mode:screen">${html}</span><span class="${cls}" style="position:absolute;left:${amt}px;top:0;color:#ff2d8a;opacity:.7;mix-blend-mode:screen">${html}</span><span class="${cls} neon" style="position:relative">${html}</span></span>`;}

function atmosphere(t){
 // drifting light leaks
 const L=[[ '#ff5fa2',300,420,520,.9,.35],[ '#ffb36b',820,1500,600,.7,.5],[ '#9a5cff',150,1650,480,.6,.27],[ '#ff8a5c',900,300,380,.8,.42]];
 leak.innerHTML=L.map(([c,x,y,r,o,sp],i)=>{const dx=Math.sin(t*sp+i)*140,dy=Math.cos(t*sp*.8+i*2)*120;const a=o*(.55+.45*Math.sin(t*.9+i*1.7));return `<div class="blob" style="left:${x+dx-r/2}px;top:${y+dy-r/2}px;width:${r}px;height:${r}px;background:${c};opacity:${a*.55}"></div>`}).join('');
 // birds gliding across the sky
 let b='';for(let i=0;i<4;i++){const T=9+i*1.7;const ph=((t+i*3.1)%T)/T;const x=-120+ph*1320,y=520+i*70+Math.sin(ph*6+i)*30;const f=Math.sin(t*9+i)*0.5+0.5;const s=1-i*.12;
  b+=`<svg width="${60*s}" height="${30*s}" viewBox="0 0 60 30" style="left:${x}px;top:${y}px;opacity:.75"><path d="M2 ${8+f*12} Q16 ${2+f*6} 30 16 Q44 ${2+f*6} 58 ${8+f*12}" fill="none" stroke="#3a1b5a" stroke-width="4" stroke-linecap="round"/></svg>`;}
 birds.innerHTML=b;
 // neon light streaks fly past at each cut
 let s='';for(const c of CUTS){const e=t-c+.25;if(e<0||e>.6)continue;const r=rnd(Math.round(c*100));for(let k=0;k<5;k++){const y=200+r()*1500,w=300+r()*500,sp=4200+r()*2600,dir=r()<.5?1:-1;const x=dir>0?-w+e*sp:1080-e*sp;s+=`<div class="streak" style="left:${x}px;top:${y}px;width:${w}px;opacity:${1-e/.6}"></div>`;}}
 streaks.innerHTML=s;
 // film grain
 const r=rnd(Math.floor(t*30)+7),img=gctx.createImageData(270,480),d=img.data;for(let i=0;i<d.length;i+=4){const v=r()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}gctx.putImageData(img,0,0);
}

function render(t){
 // camera + motion blur from velocity + shake
 const [x,y,s]=camAt(t),[x2,y2,s2]=camAt(t+1/30);
 const v=Math.hypot((x2-x)*s,(y2-y)*s)+Math.abs(s2-s)*900;
 let sx=0,sy=0,sh=0;
 if(t>7.05&&t<7.6)sh=(1-(t-7.05)/.55)*14;           // "диплом" hit
 if(t>15.2&&t<15.8)sh=(1-(t-15.2)/.6)*22;            // "а так можно было?" zoom punch
 if(t>16.9&&t<17.5)sh=(1-(t-16.9)/.6)*16;            // mission passed
 if(sh){const r=rnd(Math.floor(t*60));sx=(r()-.5)*sh*2;sy=(r()-.5)*sh*2;}
 const breathe=1+Math.sin(t*1.3)*.006;
 cam.style.transform=`translate(${540-x*s*breathe+sx}px,${960-y*s*breathe+sy}px) scale(${s*breathe})`;
 cam.style.filter=`blur(${Math.min(14,v/26).toFixed(2)}px) saturate(1.18) contrast(1.06)`;
 // flash on cuts
 let fl=0;for(const c of [3.35,15.2,16.9]){const e=t-c;if(e>=0&&e<.35)fl=Math.max(fl,(1-e/.35)*(c===16.9?.85:.55));}
 flash.style.opacity=fl;
 atmosphere(t);

 let h='';
 if(t<3.4){
  const out=1-ease(pop(t,3.05,.3));
  const pd=pop(t,.15,.5),pm=pop(t,.55,.4),pg=pop(t,1.0,.4);
  h+=`<div class="date" style="opacity:${out}">
   <div style="transform:scale(${2.4-1.4*slam(pd)});opacity:${ease(pop(t,.15,.12))}">${chromaText('disp d','19',Math.max(0,(1-pd)*22))}</div>
   <div style="transform:translateX(${(1-ease(pm))*-700}px)">${chromaText('disp m','ноября',Math.max(0,(1-pm)*14))}</div>
   <div class="g" style="transform:scale(${back(pg)}) rotate(${(1-ease(pg))*-12}deg);opacity:${ease(pg)}">ВЫХОДИТ GTA 6 🎮</div></div>`;
  h+=`<div class="sub" style="opacity:${out*ease(pop(t,1.7,.3))}">${words(t,1.7,'Студенты за неделю<br>до релиза:',.12)}</div>`;
 }
 else if(t<6.8) h+=bub(t,3.6,6.8,'l','Она','Ну что, 19-го<br>всю ночь играем? 😏');
 else if(t<10.3) h+=bub(t,7.1,10.3,'r','Он','Не могу…<br>у меня диплом 😐');
 else if(t<13.8) h+=bub(t,10.6,13.8,'l','Она','Так отдай его Ксении 😉<br>Она по главам сдаёт');
 else if(t<16.9) h+=bub(t,14.1,16.9,'r','Он','…а так можно было? 😳');

 // wanted level: diploma deadline
 if(t>=7.3&&t<17.4){
  const n=t<13.8?Math.min(5,1+Math.floor((t-7.3)/.35)):Math.max(0,5-Math.floor((t-13.8)/.3));
  const a=ease(pop(t,7.3,.2))*(1-ease(pop(t,17.1,.3)));
  h+=`<div class="want" style="opacity:${a};transform:scale(${.85+.15*back(pop(t,7.3,.3))})"><div class="lbl">РОЗЫСК: ДЕДЛАЙН</div><div class="stars">${stars(t,n,t<13.8)}</div></div>`;
 }

 if(t>=16.9){const e=t-16.9;
  const pa=pop(e,0,.45),pb=pop(e,.45,.35),outM=1-ease(pop(e,1.9,.35));
  if(e<2.3)h+=`<div class="mis" style="opacity:${outM}"><div style="transform:scale(${2.2-1.2*slam(pa)});opacity:${ease(pop(e,0,.1))}">${chromaText('disp a','миссия<br>выполнена',Math.max(0,(1-pa)*20))}</div><div class="b" style="transform:scale(${back(pb)});opacity:${ease(pb)}">+ ДИПЛОМ СДАН 📚</div></div>`;
  if(e>=1.9){const f=e-1.9;
   h+=`<div class="top" style="opacity:${ease(pop(f,.1,.35))};transform:translateY(${(1-ease(pop(f,.1,.35)))*-40}px)">Итог: он в GTA 6 🎮<br>а диплом у Ксении 📚</div>`;
   const pc=pop(f,.6,.45);
   h+=`<div class="endc" style="opacity:${ease(pc)};transform:translateY(${(1-ease(pc))*120}px) scale(${.9+.1*back(pc)})"><div class="who"><img src="../ksenia.jpg"><div><h3>Это я, Ксения 👋</h3><p>Помогаю с курсовыми<br>и дипломами, сдаю по главам</p></div></div><div class="cta" style="transform:scale(${1+Math.max(0,Math.sin((f-1.2)*5))*.04*(f>1.2?1:0)})">Пиши в директ: «GTA» 👇</div></div>`;}
 }
 h+=`<div class="brand">Ксения · помощь студентам</div>`;
 ov.innerHTML=h;}
window.CLIPS={G:{fn:render,len:LEN}};
render(0);
</script></body></html>
