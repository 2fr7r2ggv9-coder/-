<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
:root{--cream:#f7f2e9;--paper:#fffdf8;--sage:#a9bba5;--sage-soft:#dfe7da;--deep:#4f6b52;--ink:#2e3a2f;--muted:#6c776b;--terra:#d9774b;--good:#5f9a62}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream);font-family:Inter,"Noto Color Emoji",sans-serif;color:var(--ink)}
.stage{position:absolute;inset:0;overflow:hidden}
.hook{position:absolute;left:60px;right:60px;top:110px;text-align:center;font-weight:900;font-size:76px;line-height:1.08;letter-spacing:-.02em}
.hook small{display:block;font-size:38px;font-weight:600;color:var(--muted);margin-top:18px;letter-spacing:0}
.hl{background:var(--terra);color:#fff;padding:0 14px;border-radius:14px}
/* chat */
.phone{position:absolute;left:50px;right:50px;top:440px;bottom:120px;background:var(--paper);border-radius:56px;box-shadow:0 30px 80px rgba(79,107,82,.18);overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:22px;padding:30px 36px;border-bottom:2px solid #eee7da}
.av{width:92px;height:92px;border-radius:50%;background:var(--sage-soft);display:grid;place-items:center;font-size:48px;flex:none}
.bar b{font-size:40px;display:block}
.bar span{font-size:30px;color:var(--muted)}
.bar span.typing{color:var(--deep);font-weight:600}
.feed{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;padding:30px 30px 40px;overflow:hidden;background:linear-gradient(#f3efe6,#efe9dc)}
.msg{max-width:78%;font-size:46px;line-height:1.25;padding:22px 30px;border-radius:38px;transform-origin:bottom left}
.in{background:#fff;align-self:flex-start;border-bottom-left-radius:10px}
.out{background:var(--deep);color:#fff;align-self:flex-end;border-bottom-right-radius:10px;transform-origin:bottom right}
.msg em{font-style:normal;display:block;text-align:right;font-size:24px;opacity:.55;margin-top:4px}
.dots{display:flex;gap:12px;padding:30px 34px}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--sage)}
/* end card */
.end{position:absolute;inset:0;background:var(--deep);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:80px;text-align:center}
.end img{width:340px;height:340px;border-radius:50%;object-fit:cover;border:10px solid var(--cream)}
.end h2{font-size:72px;line-height:1.12;font-weight:900;letter-spacing:-.02em}
.end p{font-size:42px;opacity:.9;line-height:1.3}
.pill{background:var(--terra);color:#fff;font-weight:800;font-size:48px;padding:28px 60px;border-radius:999px}
/* quiz */
.round{position:absolute;top:150px;left:0;right:0;text-align:center;font-size:40px;font-weight:800;color:var(--deep);letter-spacing:.08em;text-transform:uppercase}
.topic{position:absolute;left:70px;right:70px;top:250px;background:var(--paper);border-radius:48px;padding:56px 56px;box-shadow:0 30px 80px rgba(79,107,82,.16)}
.topic .lbl{font-size:32px;color:var(--muted);font-weight:600;margin-bottom:18px}
.topic .t{font-size:62px;line-height:1.15;font-weight:800;letter-spacing:-.015em}
.opts{position:absolute;left:70px;right:70px;top:960px;display:flex;flex-direction:column;gap:26px}
.opt{display:flex;align-items:center;gap:30px;background:var(--paper);border:4px solid #e6dfd1;border-radius:36px;padding:30px 40px;font-size:52px;font-weight:700}
.opt i{font-style:normal;width:80px;height:80px;border-radius:50%;background:var(--sage-soft);color:var(--deep);display:grid;place-items:center;font-size:40px;font-weight:900;flex:none}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff}
.opt.ok i{background:#fff;color:var(--good)}
.timer{position:absolute;left:50%;top:1600px;width:170px;height:170px;margin-left:-85px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font-size:90px;font-weight:900}
.comment{position:absolute;left:70px;right:70px;top:1600px;text-align:center;font-size:48px;font-weight:700;color:var(--deep)}
.brand{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:30px;color:var(--muted);font-weight:600}
</style></head>
<body><div class="stage" id="s"></div>
<script>
const S=document.getElementById('s');
const clamp=(x)=>Math.max(0,Math.min(1,x));
const ease=(p)=>1-Math.pow(1-p,3);
const back=(p)=>{const c=1.6;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const pop=(t,t0,d=.3)=>clamp((t-t0)/d);

/* ---------- CLIP A: староста ---------- */
const A_MSGS=[
 {t:1.6,who:'in',text:'Добрый вечер! Пишу от лица всей группы 🙋‍♀️'},
 {t:3.2,who:'in',text:'Мы тут посовещались…'},
 {t:4.4,who:'out',text:'Слушаю ☺️'},
 {t:5.8,who:'in',text:'Курсовую у нас никто не начинал'},
 {t:7.0,who:'in',text:'Сдавать 20 декабря'},
 {t:8.4,who:'in',text:'А можно скидку как за опт? 🙏'},
 {t:9.6,who:'out',text:'А сколько вас? 😅'},
 {t:11.2,who:'in',text:'27'},
 {t:12.6,who:'in',text:'Ладно, пока 4'},
 {t:14.0,who:'in',text:'Остальные 23 читают эту переписку 👀'},
];
const A_END=15.6, A_LEN=19.5;
function clipA(t){
  const typing = A_MSGS.find(m=>m.who==='in' && t>=m.t-0.8 && t<m.t);
  let h=`<div class="hook" style="opacity:${ease(pop(t+0.5,0,.35))};transform:scale(${0.9+0.1*back(pop(t+0.5,0,.45))})">Староста написала<br>за <span class="hl">ВСЮ</span> группу 😳</div>
  <div class="phone"><div class="bar"><div class="av">👩‍🎓</div><div><b>Староста 3 курса</b><span class="${typing?'typing':''}">${typing?'печатает…':'в сети'}</span></div></div><div class="feed">`;
  for(const m of A_MSGS){ if(t<m.t) continue; const p=pop(t,m.t,.28);
    h+=`<div class="msg ${m.who}" style="opacity:${ease(p)};transform:scale(${0.7+0.3*back(p)})">${m.text}<em>23:4${A_MSGS.indexOf(m)%10}</em></div>`;}
  if(typing){ h+=`<div class="msg in dots">`+[0,1,2].map(i=>`<i style="opacity:${0.35+0.65*Math.abs(Math.sin((t*5)-i*.7))}"></i>`).join('')+`</div>`;}
  h+=`</div></div>`;
  if(t>=A_END){const p=ease(pop(t,A_END,.5));
    h+=`<div class="end" style="opacity:${p}"><img src="ksenia.jpg"><h2>Староста, передай группе:<br>места до сессии ещё есть 🥰</h2><p>Курсовые · дипломы · отчёты по практике<br>Нижний Новгород и онлайн</p><div class="pill" style="transform:scale(${0.85+0.15*back(pop(t,A_END+.5,.4))})">Пиши в личку</div></div>`;}
  S.innerHTML=h;
}

/* ---------- CLIP B: угадай специальность ---------- */
const B_ROUNDS=[
 {topic:'Образ кота в русской литературе XIX века',opts:['Ветеринария','Литература','Философия'],ok:1,c:'Ветеринария была бы смелее 😄'},
 {topic:'Прокрастинация студентов накануне сессии: причины и последствия',opts:['Психология','Педагогика','Менеджмент'],ok:0,c:'Тему все изучали на практике 🙃'},
 {topic:'Городецкий пряник как туристский бренд Нижегородской области',opts:['Маркетинг','История','Туризм'],ok:2,c:'Да, такие темы правда бывают 🍪'},
];
const B_HOOK=2.6, B_R=7.6, B_END=B_HOOK+B_R*3, B_LEN=B_END+4.5;
function clipB(t){
  let h='';
  if(t<B_HOOK){
    h=`<div class="hook" style="top:560px;opacity:${ease(pop(t+0.5,0,.3))};transform:scale(${0.85+0.15*back(pop(t+0.5,0,.45))})">Угадаешь<br>специальность<br>по <span class="hl">теме курсовой?</span> 🤔<small>3 раунда · пиши счёт в комментарии</small></div>`;
  } else if(t<B_END){
    const i=Math.floor((t-B_HOOK)/B_R), r=B_ROUNDS[i], lt=(t-B_HOOK)-i*B_R;
    const reveal=lt>=5.0;
    h+=`<div class="round" style="opacity:${ease(pop(lt,0,.3))}">Раунд ${i+1} из 3</div>`;
    const tp=pop(lt,0.1,.4);
    h+=`<div class="topic" style="opacity:${ease(tp)};transform:translateY(${(1-ease(tp))*60}px)"><div class="lbl">Тема курсовой:</div><div class="t">«${r.topic}»</div></div><div class="opts">`;
    r.opts.forEach((o,k)=>{const p=pop(lt,0.9+k*.25,.3);
      const cls=reveal&&k===r.ok?'opt ok':'opt'; const op=reveal&&k!==r.ok?0.35:1;
      const sc=reveal&&k===r.ok?(1+0.05*Math.sin(clamp((lt-5)/0.4)*Math.PI)):1;
      h+=`<div class="${cls}" style="opacity:${ease(p)*op};transform:translateX(${(1-ease(p))*-80}px) scale(${sc})"><i>${'АБВ'[k]}</i>${o}${reveal&&k===r.ok?' ✓':''}</div>`;});
    h+=`</div>`;
    if(lt>=2.0 && !reveal){const n=3-Math.floor(lt-2.0); const fp=(lt-2.0)%1;
      h+=`<div class="timer" style="transform:scale(${1.15-0.15*ease(clamp(fp/.3))})">${n}</div>`;}
    if(reveal){const p=pop(lt,5.3,.4);h+=`<div class="comment" style="opacity:${ease(p)}">${r.c}</div>`;}
    h+=`<div class="brand">Ксения · помощь студентам</div>`;
  } else {
    const lt=t-B_END;
    h+=`<div class="end" style="opacity:${ease(pop(lt,0,.4))}"><h2>Сколько угадал?<br>Пиши в комментарии 👇</h2><img src="ksenia.jpg" style="width:280px;height:280px"><p>А если своя курсовая горит —<br>помогу с курсовой, дипломом или отчётом</p><div class="pill" style="transform:scale(${0.85+0.15*back(pop(lt,.5,.4))})">Пиши в личку</div></div>`;
  }
  S.innerHTML=h;
}
window.CLIPS={A:{fn:clipA,len:A_LEN},B:{fn:clipB,len:B_LEN}};
</script></body></html>
