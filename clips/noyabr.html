<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0d1220;font-family:Inter,"Noto Color Emoji",sans-serif;color:#fff}
#snow{position:absolute;inset:0}
.t1{position:absolute;left:70px;right:70px;top:300px;text-align:center;font-weight:900;font-size:96px;line-height:1.05;letter-spacing:-.02em}
.t2{position:absolute;left:80px;right:80px;top:560px;text-align:center;font-weight:700;font-size:52px;line-height:1.3;color:#dfe6ff}
.cap{position:absolute;left:0;right:0;top:250px;text-align:center;font-weight:900;font-size:64px}
.win{position:absolute;left:60px;right:60px;top:400px;height:1220px;background:#f3f3f3;border-radius:22px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6);color:#222}
.tb{height:70px;background:#2b579a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600;position:relative}
.tb .d{position:absolute;right:24px;top:24px;display:flex;gap:18px}
.tb .d i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.5)}
.rib{height:96px;background:#fff;border-bottom:2px solid #ddd;display:flex;align-items:center;gap:22px;padding:0 30px}
.rib b{width:46px;height:40px;border-radius:8px;background:#e6e9ef}
.rib span{font-size:26px;color:#555;margin-right:10px}
.page{position:absolute;left:90px;right:90px;top:200px;bottom:110px;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.12);padding:90px 80px}
.cur{width:4px;height:52px;background:#111}
.status{position:absolute;left:0;right:0;bottom:0;height:70px;background:#e9e9e9;display:flex;align-items:center;gap:40px;padding:0 30px;font-size:26px;color:#444}
.pop{position:absolute;left:150px;right:150px;top:760px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:34px 40px;color:#222;font-size:36px;line-height:1.35;border-left:10px solid #e8a33d}
.pop b{display:block;font-size:30px;color:#888;margin-bottom:8px}
.brand{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:28px;color:rgba(255,255,255,.5);font-weight:600}
</style></head><body><canvas id="snow" width="1080" height="1920"></canvas><div id="s"></div>
<script>
const S=document.getElementById('s'),cv=document.getElementById('snow').getContext('2d');
const clamp=x=>Math.max(0,Math.min(1,x)),ease=p=>1-Math.pow(1-p,3),pop=(t,a,d=.35)=>clamp((t-a)/d);
let seed=3;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const flakes=[...Array(140)].map(()=>({x:rnd()*1080,y:rnd()*1920,r:2+rnd()*6,v:60+rnd()*140,w:rnd()*6.28}));
function snow(t){cv.clearRect(0,0,1080,1920);cv.fillStyle='rgba(255,255,255,.75)';for(const f of flakes){const y=(f.y+f.v*t)%1960-20;const x=f.x+Math.sin(t*1.2+f.w)*24;cv.beginPath();cv.arc(x,y,f.r,0,6.28);cv.fill();}}
function render(t){snow(t);let h='';
 if(t<3.6){const a=t<3.2?1:1-ease(pop(t,3.2,.4));
  h+=`<div class="t1" style="opacity:${a*ease(pop(t+0.4,0,.3))}">Ноябрь 2026<br>наступил ❄️</div>`;
  h+=`<div class="t2" style="opacity:${a*ease(pop(t,0.9,.4))}">Студенты, которые в сентябре сказали<br>«в этот раз начну курсовую заранее»:</div>`;
 } else {
  const p=ease(pop(t,3.6,.45));
  h+=`<div class="cap" style="opacity:${p}">их курсовая:</div>`;
  h+=`<div class="win" style="opacity:${p};transform:translateY(${(1-p)*120}px) scale(${0.94+0.06*p})">
   <div class="tb">Курсовая_ФИНАЛ_точно.docx<div class="d"><i></i><i></i><i></i></div></div>
   <div class="rib"><span>Файл</span><span>Главная</span><span>Вставка</span><b></b><b></b><b></b></div>
   <div class="page"><div class="cur" style="opacity:${Math.floor(t*2)%2?0:1}"></div></div>
   <div class="status"><span>Страница 1 из 1</span><span>Число слов: 0</span></div></div>`;
  if(t>=7.0){const q=ease(pop(t,7.0,.35));h+=`<div class="pop" style="opacity:${q};transform:scale(${0.9+0.1*q})"><b>Автосохранение</b>Последнее изменение: 1 сентября</div>`;}
 }
 h+=`<div class="brand">Ксения · помощь студентам</div>`;
 S.innerHTML=h;}
window.CLIPS={N:{fn:render,len:11.5}};
</script></body></html>
